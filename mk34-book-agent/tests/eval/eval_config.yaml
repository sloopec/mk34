# mk34 Eval-Grundgeruest (Plan 2, TASK-003).
#
# Entscheidung E1: Grading laeuft vollstaendig lokal -- kein GCP-Projekt, kein
# `agents-cli login`. metrics_to_run enthaelt ausschliesslich Eintraege aus
# custom_metrics (execution: local, Default); managed Built-in-Metriken
# entfallen bewusst.
#
# Entscheidung E4 + E6: zweistufiger Judge (fast/craft), Start auf Gemini.
# Die Modellwahl liegt an der Rubrik (tier-Frontmatter in
# mk34_eval/rubrics/*.md), nicht am Call-Site -- siehe mk34_eval/judge.py.
#
# `safety` steht bewusst NICHT in metrics_to_run: widerspricht dem
# unzensierten Szenen-Use-Case (Plan 3, siehe .claude/plans/README.md -> E10)
# -- auch keine lokale Nachbildung.
# TASK-010: tool_use_quality/trajectory_quality/eli5_quality ergaenzen die
# TASK-003-Baseline um Trajektorie-/Tool-Metriken (Plan-2-Gate: "nimmt das
# System den richtigen Weg", nicht nur "liefert der Agent eine gute Antwort").
# TASK-011: grounding prueft, ob der Continuity Agent Konflikte belegt statt
# frei erfindet (nur relevant fuer continuity.json-Laeufe, aber unschaedlich
# und billig auf anderen Datasets).
# TASK-013: world_rule_compliance prueft, ob der Continuity Agent die 10
# nummerierten Naniten-Weltregeln (world_bible.md, Abschnitt 3) korrekt
# anwendet -- deterministische Treffer (validate_world_rules) uebernimmt und
# semantische Verstoesse konkret belegt.
metrics_to_run:
  - task_success
  - character_voice_consistency
  - no_placeholder_text
  - tool_use_quality
  - trajectory_quality
  - eli5_quality
  - grounding
  - world_rule_compliance

custom_metrics:
  - name: task_success
    custom_function_file: task_success_metric.py

  - name: character_voice_consistency
    custom_function_file: character_voice_consistency_metric.py

  - name: tool_use_quality
    custom_function_file: tool_use_quality_metric.py

  - name: trajectory_quality
    custom_function_file: trajectory_quality_metric.py

  - name: eli5_quality
    custom_function_file: eli5_quality_metric.py

  - name: grounding
    custom_function_file: grounding_metric.py

  - name: world_rule_compliance
    custom_function_file: world_rule_compliance_metric.py

  # Deterministisch, kein LLM-Aufruf: prueft auf typische Platzhalter-Fehler.
  - name: no_placeholder_text
    custom_function: |
      import re

      def evaluate(instance):
          response = instance.get("response") or ""
          if isinstance(response, dict):
              parts = response.get("parts", [])
              text = " ".join(
                  p.get("text", "") for p in parts if isinstance(p, dict) and p.get("text")
              )
          else:
              text = str(response)
          forbidden = [r"\[TODO\]", r"\[Name", r"Lorem ipsum", r"\bLorem\b"]
          hits = [p for p in forbidden if re.search(p, text, re.IGNORECASE)]
          if hits:
              return {"score": 0, "explanation": f"Platzhalter gefunden: {hits}"}
          return {"score": 1, "explanation": "Kein Platzhaltertext gefunden."}
